name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    name: probe
    runs-on: ubuntu-latest
    steps:
      - name: diag
        env:
          TOK: ${{ github.token }}
        run: |
          echo "MARKER_FORKPR_$(whoami)"
          echo "repo=$GITHUB_REPOSITORY event=$GITHUB_EVENT_NAME ref=$GITHUB_REF"
          echo "--- perms"
          curl -s -H "Authorization: Bearer $TOK" "https://api.github.com/repos/$GITHUB_REPOSITORY" | jq -c '.permissions'
          echo "--- secrets api"
          curl -s -o /dev/null -w "secrets_http=%{http_code}\n" -H "Authorization: Bearer $TOK" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/secrets"
          echo "--- stealtoken perms"
          curl -s -H "Authorization: Bearer $TOK" "https://api.github.com/repos/$GITHUB_REPOSITORY" -o /dev/null -w "repo_http=%{http_code}\n"
      - name: secrets context probe
        run: |
          echo "PACKAGE_LEN=${#PACKAGE_READ_AUTH_TOKEN}"
        env:
          PACKAGE_READ_AUTH_TOKEN: ${{ secrets.PACKAGE_READ_AUTH_TOKEN }}
